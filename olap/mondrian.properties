# ============================================================================
# Mondrian OLAP Server Configuration - Ecommerce BI
# ============================================================================

# ---------------------------
# JDBC CONNECTION (MySQL)
# ---------------------------
mondrian.jdbcDrivers=com.mysql.cj.jdbc.Driver
mondrian.jdbc=jdbc:mysql://localhost:3306/ecommerce_bi?useSSL=false&serverTimezone=UTC
mondrian.jdbcUser=bi_user
mondrian.jdbcPassword=bi_password

# ---------------------------
# CATALOG / SCHEMA
# ---------------------------
# Use absolute path in production deployments.
mondrian.catalogURL=./olap/ecommerce_catalog.xml
mondrian.schema.validate=true
mondrian.xmla.drillthroughTotalCount.enable=true

# ---------------------------
# CACHING
# ---------------------------
mondrian.rolap.star.disableCaching=false
mondrian.expCache.enable=true
mondrian.rolap.SparseSegmentDensityThreshold=0.5

# ---------------------------
# QUERY EXECUTION
# ---------------------------
mondrian.query.limit=100000
mondrian.rolap.maxConstraints=1000
mondrian.result.highCardChunkSize=1000

# ---------------------------
# LOGGING
# ---------------------------
# Increase to DEBUG only when troubleshooting.
mondrian.rolap.generate.formatted.sql=true

# ============================================================================
# DEPLOYMENT NOTES
# ============================================================================
# 1) Deploy ecommerce_catalog.xml to Mondrian classpath.
# 2) Ensure MySQL connector JAR is on server classpath.
# 3) Replace credentials above for your environment.
# 4) Restart Saiku/Pentaho server after any schema change.
# 5) For PostgreSQL, use ./olap/mondrian-postgres.properties.
